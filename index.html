<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GP09 Web🏎</title>
    <link rel="icon" type="image/x-icon" href="f1-car.ico">

    
    <!-- 1. Configuração colocada ANTES do coi-serviceworker -->
    <script>
        window.coi = {
            coepCredentialless: () => true
        };
    </script>
    <script src="coi-serviceworker.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        window.EJS_player = '#game';
        window.EJS_core = 'psp';
        window.EJS_gameName = 'GP09';
        window.EJS_gameUrl = 'https://' + 'proxy-rom.mgeversa1.workers.dev/track09.iso';
        
        // Linhas essenciais que estavam faltando:
        window.EJS_pathtodata = 'https://' + 'cdn.emulatorjs.org/stable/data/';
        window.EJS_threads = true;
        window.EJS_startOnLoaded = true;
        window.EJS_CacheLimit = 1073741824;
        window.EJS_gameID = 200902;

        window.EJS_defaultOptions = {
            'ppsspp_auto_frameskip': 'enabled',
            'ppsspp_frameskip': '2',
            'ppsspp_internal_resolution': '480x272',
            'ppsspp_cpu_core': 'jit',
            'ppsspp_locked_cpu_speed': '111',
            'ppsspp_lazy_texture_caching': 'enabled',
            'ppsspp_fast_memory': 'enabled',
            'ppsspp_software_skinning': 'enabled'
        };

        const script = document.createElement('script');
        script.src = 'https://' + 'cdn.emulatorjs.org/stable/data/loader.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
