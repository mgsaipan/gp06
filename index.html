<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GP06 Web</title>
    
    <!-- 1. Configuração colocada ANTES do coi-serviceworker -->
    <script>
        window.coi = {
            coepCredentialless: () => true
        };
    </script>
    <script src="coi-serviceworker.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        const urlExterna = 'https://archive.org';

        window.EJS_player = '#game';
        window.EJS_core = 'psp';
        window.EJS_gameName = 'GP06';
        window.EJS_gameUrl = urlExterna;
        window.EJS_pathtodata = 'https://emulatorjs.org';
        window.EJS_threads = true;
        window.EJS_startOnLoaded = true;

        const script = document.createElement('script');
        script.src = 'https://emulatorjs.orgloader.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
